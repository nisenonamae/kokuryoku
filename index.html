<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>国力年報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 省アプリと同じ紙の地。色は意味を持つものだけ:墨(国力)、藍(国力の線)、緑(伸びた)、朱(落ちた・足りない)。省はそれぞれの省の色 */
:root{--paper:#F6F3EC;--sheet:#FBF9F4;--ink:#26221E;--sub:#6E665C;--rule:#DCD5C7;--shu:#B5432F;--wave:#2F4F8A;--ok:#3D7A55;--spark:#2F6E8A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:15px;line-height:1.65;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wave);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:1.1rem 1rem 2rem}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--shu)}

/* 見出し(省アプリと同じ形) */
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-bottom:.6rem;border-bottom:2px solid var(--ink);margin-bottom:1rem}
.mast h1{margin:0;font-size:1.35rem;letter-spacing:.12em}
.mast .era{text-align:right;line-height:1.3}
.mast .era b{font-size:1rem}
.mast .era small{display:block;color:var(--sub);font-size:.78rem}

/* 三つの柱 */
.pillars{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:.6rem;margin-bottom:.7rem}
.pillar{border:1px solid var(--rule);border-radius:6px;background:#fff;padding:.5rem .7rem .55rem;border-top:3px solid var(--ink)}
.pillar.wait{background:transparent;border-style:dashed;border-top:3px dashed var(--rule)}
.pillar h2{margin:0;font-size:.82rem;letter-spacing:.12em;color:var(--sub)}
.pillar .v{font-weight:700;font-size:2.1rem;line-height:1.1;margin:.1rem 0 0;font-variant-numeric:tabular-nums}
.pillar.wait .v{color:var(--rule)}
.pillar .d{font-size:.8rem}
.pillar .s{font-size:.72rem;color:var(--sub);line-height:1.45;margin-top:.15rem}
.pillar .parts{display:flex;gap:.3rem;margin-top:.35rem;flex-wrap:wrap}
.pillar .parts span{font-size:.7rem;color:var(--sub);border:1px dashed var(--rule);padding:0 .35rem;border-radius:3px}
.pillar .psp{display:block;width:100%;height:30px;margin:.15rem 0 .1rem}

/* 区画(省アプリの「パネル」と同じ形) */
.sect{border:1px solid var(--rule);border-radius:6px;background:#fff;margin:.7rem 0;padding:0 .75rem .7rem;overflow:hidden}
.sect>h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:.1rem .6rem;margin:0 -.75rem .6rem;padding:.4rem .75rem;border-bottom:1px solid var(--rule);background:#FAF8F3;font-size:.86rem;letter-spacing:.04em}
.sect>h3 small{font-weight:400;font-size:.76rem;color:var(--sub);letter-spacing:0}
.lead{margin:.1rem 0 .7rem;font-size:.82rem;color:var(--sub)}
.chips{display:inline-flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:.1rem 0 .6rem}
.chips button{border:none;background:#fff;padding:.2rem .65rem;font-size:.8rem;cursor:pointer;color:var(--sub)}
.chips button+button{border-left:1px solid var(--rule)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.dates{display:flex;gap:.3rem;align-items:center;margin:-.3rem 0 .6rem;font-size:.8rem;color:var(--sub)}
.dates input{border:1px solid var(--rule);border-radius:4px;padding:.1rem .35rem;font-size:.8rem;background:#fff}
.empty{color:var(--sub);padding:1rem 0;font-size:.9rem}
svg text{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
.chart{width:100%;display:block}
.subline{display:flex;flex-wrap:wrap;gap:.1rem 1rem;font-size:.78rem;color:var(--sub);margin-top:.3rem}
.subline b{color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.74rem;color:var(--sub);margin-top:.3rem}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--wave);vertical-align:middle;margin-right:.3rem}
.legend i.dash{border-top:1.5px dashed var(--sub)}
.legend i.band{height:9px;border:0;background:#EFE9DC}

/* 要因 */
.vd{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin:.1rem 0 .1rem}
.vd-d{font-size:.86rem;color:var(--sub)} .vd-n{font-weight:700;font-size:1.9rem;line-height:1.1}
.vd-top{margin:0 0 .7rem;font-size:.86rem;color:var(--sub)} .vd-top b{color:var(--ink)}
.tug{margin:0 0 .8rem}
.tug-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--rule)}
.tug-bar i{display:block;height:100%} .tug-bar i.u{background:var(--ok)} .tug-bar i.d{background:var(--shu)}
.tug-l{display:flex;justify-content:space-between;font-size:.76rem;margin-top:.2rem}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 38% 3rem;gap:.5rem;align-items:center;padding:.32rem 0;border-top:1px dashed var(--rule);font-size:.86rem}
.subh+.cr{border-top:0}
.cr-n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-n i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem;vertical-align:middle}
.cr-n em{font-style:normal;font-size:.68rem;color:var(--sub);border:1px solid var(--rule);border-radius:3px;padding:0 .3rem;margin-left:.35rem}
.cr-b{display:grid;grid-template-columns:1fr 1fr;height:10px;position:relative}
.cr-b::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--rule)}
.cr-l,.cr-r{position:relative}
.cr-l i,.cr-r i{position:absolute;top:0;bottom:0;border-radius:5px}
.cr-l i{right:0;background:var(--shu)} .cr-r i{left:0;background:var(--ok)}
.cr-v{text-align:right;font-weight:700}
.cr-more{font-size:.74rem;color:var(--sub);padding:.2rem 0 .1rem;border-top:1px dashed var(--rule)}
.subh{margin-top:.6rem}
.verdict{font-size:1rem;line-height:1.7;margin:.1rem 0 .8rem}
.verdict .big{font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:minmax(0,1fr) 3.4rem minmax(0,1fr);gap:.2rem 0;align-items:center}
.bars .lab{grid-column:1/-1;display:flex;justify-content:space-between;gap:.5rem;font-size:.84rem;margin-top:.3rem}
.bars .lab span:last-child{color:var(--sub);font-size:.72rem;text-align:right}
.bar-l,.bar-r{height:10px;position:relative;background:transparent}
.bar-l i,.bar-r i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar-l i{right:0;background:var(--shu)} .bar-r i{left:0;background:var(--ok)}
.bars .mid{text-align:center;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.subh{font-size:.82rem;color:var(--sub);letter-spacing:.06em;margin:.2rem 0 .2rem}
.mcard{display:grid;grid-template-columns:5.5rem 1fr 3rem;gap:.1rem .6rem;align-items:center;padding:.45rem 0;border-top:1px dashed var(--rule)}
.mcard:first-of-type{border-top:0}
.mcard .nm{font-weight:700;color:var(--mc)}
.mcard .stack{height:10px;border-radius:5px;overflow:hidden;background:var(--rule)}
.mcard .stack i{display:block;height:100%}
.mcard .tot{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mcard .why{grid-column:2/-1;font-size:.74rem;color:var(--sub)}
.moves{display:flex;flex-direction:column}
.move{display:flex;align-items:center;gap:.45rem;font-size:.86rem;padding:.3rem 0;border-top:1px dashed var(--rule)}
.move:first-child{border-top:0}
.move .t{flex:1;min-width:0}
.move .st{font-size:.72rem;border-radius:3px;padding:0 .35rem;border:1px solid var(--rule);color:var(--sub);white-space:nowrap;background:#fff}
.move .st.to.up{border-color:var(--ok);color:var(--ok)} .move .st.to.down{border-color:var(--shu);color:var(--shu)}
.move .arw{color:var(--rule)} .move .dt{font-size:.72rem;color:var(--sub);width:2.6rem;text-align:right}

/* 戦況盤と省 */
.board{border:1px solid var(--rule);border-radius:6px;background:#fff}
.board svg{display:block;width:100%;height:auto}
.bub{cursor:pointer}
.mins{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.5rem;margin-top:.7rem}
.min{border:1px solid var(--rule);border-radius:5px;background:#fff;padding:.45rem .6rem .5rem;cursor:pointer;border-left:4px solid var(--mc)}
.min.sel{background:color-mix(in srgb,var(--mc) 8%,#fff);border-color:var(--mc)}
.min .hd{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem}
.min .hd b{color:var(--mc);font-size:.95rem}
.min .hd .p{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.min .sp{display:block;width:100%;height:28px;margin:.15rem 0 .2rem}
.min .mt{display:grid;grid-template-columns:2.6rem 1fr 2.3rem;gap:.12rem .35rem;align-items:center;font-size:.7rem;color:var(--sub)}
.min .mt i{display:block;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.min .mt i b{display:block;height:100%;background:var(--mc)}
.min .mt span:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{display:inline-block;margin-top:.35rem;font-size:.7rem;padding:0 .4rem;border-radius:3px;border:1px solid}
.tag.idle{color:var(--shu);border-color:var(--shu);background:#FBF0EC} .tag.thin{color:#8A6A1E;border-color:#C9A65A;background:#FBF6EA} .tag.over{color:var(--ok);border-color:var(--ok);background:#EEF5F0}
.lowtag{font-size:.66rem;color:var(--shu);margin-left:.3rem;white-space:nowrap;font-weight:400}
.min .hd b{min-width:0}
.share{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:.2rem 0 .5rem;background:var(--rule)}
.share i{display:block;height:100%}
.share-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:.1rem .8rem;font-size:.78rem;color:var(--sub)}
.share-l span i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.share-l b{color:var(--ink);font-weight:700;margin-left:.2rem}

/* 統治 */
.gv-head{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;align-items:center}
.gv-v{font-weight:700;font-size:2.4rem;line-height:1.05;font-variant-numeric:tabular-nums}
.gv-g .gv-v{font-size:1.6rem}
.gv-sp{display:block;width:100%;height:44px;grid-row:1/3;grid-column:2}
.gv-head .d{grid-column:1}
.gv-two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem}
.gv-g{border:1px solid var(--rule);border-radius:5px;padding:.4rem .6rem}
.gv-g b{font-size:.92rem;letter-spacing:.06em}.gv-g small{display:block;font-size:.7rem;color:var(--sub)}
.gv-g .sp{display:block;width:100%;height:30px;margin-top:.2rem}
.gv-el{display:grid;grid-template-columns:5.2rem 1fr 2.4rem 3.4rem;gap:.1rem .5rem;align-items:center;padding:.35rem 0;border-top:1px dashed var(--rule)}
.gv-el:first-of-type{border-top:0}
.gv-n{font-weight:700;font-size:.88rem}.gv-s .sp{display:block;width:100%;height:24px}
.gv-x{text-align:right;font-weight:700}.gv-c{text-align:right;font-size:.78rem}
.gv-l{grid-column:1/-1;font-size:.72rem;color:var(--sub)}
nav.tabs button{font-size:.92rem}
/* 威信 */
.pre-eq{display:flex;align-items:center;gap:.5rem;margin:.6rem 0 .3rem;flex-wrap:wrap}.pre-eq span{display:flex;flex-direction:column;align-items:center;min-width:3.6rem}.pre-eq b{font-size:1.15rem}.pre-eq small{font-size:.7rem;color:var(--sub)}.pre-eq i{font-style:normal;color:var(--sub)}
.note-s{font-size:.76rem;color:var(--sub);margin:.4rem 0 0}
.pct{font-size:.42em;font-weight:500;color:var(--sub);margin-left:.35em;letter-spacing:0}
.gv-x .pct{font-size:.72em;display:block;margin:0;line-height:1}
.pm-sw{display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:baseline;font-size:.86rem;font-weight:700;margin-top:.15rem}.pm-sw small{font-weight:400;font-size:.72rem;color:var(--sub)}
.psub{margin:.1rem 0 .5rem}
.pre-by{margin-top:.6rem}.pre-by .cr-n{white-space:normal}.pre-by .cr-n em{display:block;font-style:normal;font-size:.7rem;color:var(--sub);border:0;padding:0;margin:0}
.pm{padding:.45rem 0;border-top:1px dashed var(--rule)}.pm:first-of-type{border-top:0}
.pm-h{display:flex;align-items:baseline;gap:.45rem}.pm-h b{flex:1;min-width:0;font-size:.9rem}
.pm-k{font-size:.7rem;border-radius:3px;padding:0 .35rem;border:1px solid}.pm-k.k1{color:var(--wave);border-color:var(--wave)}.pm-k.k2{color:var(--sub);border-color:var(--rule)}
.pm-d{font-weight:700}.pm-s{font-size:.74rem;color:var(--sub);margin-top:.1rem}
/* 時間 */
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.tk{border:1px solid var(--rule);border-radius:5px;padding:.4rem .55rem;background:#fff}
.tk b{font-size:.84rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk svg{display:block;width:100%;height:32px;margin:.15rem 0}
.tk .r{display:flex;justify-content:space-between;font-size:.74rem;color:var(--sub)}

/* 設定 */
.conn{border:1px solid var(--rule);border-radius:6px;background:#fff;padding:.7rem .85rem;margin:.7rem 0}
.conn h2{margin:0 0 .3rem;font-size:.92rem;letter-spacing:.08em}
.conn p{margin:.2rem 0 .6rem;color:var(--sub);font-size:.82rem}
.conn .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.5rem .7rem}
.conn label{display:block;font-size:.74rem;color:var(--sub);margin-bottom:.1rem}
.conn input{width:100%;padding:.4rem .5rem;border:1px solid var(--rule);border-radius:4px;background:#fff}
.conn .row{display:flex;gap:.6rem;align-items:center;margin-top:.8rem;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:.38rem .9rem;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}
.msg{font-size:.82rem;color:var(--sub)} .msg.err{color:var(--shu)}
.rule-row{display:grid;grid-template-columns:2.8rem 1fr;gap:.1rem .7rem;padding:.45rem 0;border-top:1px dashed var(--rule);font-size:.86rem}
.rule-row:first-of-type{border-top:0}
.rule-row .v{font-weight:700}
.rule-row .v i{display:block;width:100%;height:3px;margin-top:.2rem;border-radius:2px}
.rule-row small{display:block;color:var(--sub);font-size:.76rem}
.foot{font-size:.74rem;color:var(--sub);text-align:center;margin-top:1rem}

/* 裏画面:計算式 */
.fx-open{border:none;background:none;padding:0;font:inherit;font-size:.7rem;color:var(--sub);text-decoration:underline dotted;cursor:pointer}
.fx-top{display:flex;align-items:center;gap:.8rem;margin:.2rem 0 .4rem}.fx-top b{font-size:1rem;letter-spacing:.08em}
.linkbtn{border:none;background:none;padding:0;font:inherit;color:var(--wave);cursor:pointer;font-size:.85rem}
.eq{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:.8rem;line-height:1.7;background:#FAF8F3;border:1px solid var(--rule);border-radius:4px;padding:.55rem .7rem;white-space:pre-wrap;margin:.1rem 0 .6rem}
.fx-t{width:100%;border-collapse:collapse;font-size:.78rem;margin:.2rem 0 .3rem}
.fx-t th,.fx-t td{border-top:1px solid var(--rule);padding:.3rem .35rem;text-align:left;vertical-align:top}
.fx-t th{color:var(--sub);font-weight:700;background:#FAF8F3}
.fx-t td:first-child,.fx-t th:first-child{white-space:nowrap}
.fx-n{font-size:.78rem;color:var(--sub);margin:.3rem 0}
/* タブ(省アプリと同じ) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;cursor:pointer;color:var(--sub);font-weight:700;min-width:0}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--shu)}
@media (max-width:520px){ .pillars{grid-template-columns:1fr 1fr} .pillars .pillar:first-child{grid-column:1/-1} }
@media (prefers-reduced-motion:no-preference){ .draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1s ease-out forwards} @keyframes draw{to{stroke-dashoffset:0}} }
</style>
<style>.se-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.5rem 0;font-size:.86rem}.se-btn{min-width:2.6rem;border:1px solid #bbb;border-radius:999px;background:#fff;padding:.1rem .7rem;font:inherit;cursor:pointer}.se-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.se-vol{display:flex;align-items:center;gap:.3rem}.se-vol input{width:8rem}</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>国力年報</h1>
    <div class="era" id="era"><b>—</b><small id="stamp">読み込み中</small></div>
  </header>

  <section class="conn" id="conn" hidden>
    <h2>接続</h2>
    <p>国力の集計は非公開のリポジトリにあります。行軍表と同じトークンが使えます。トークンはこの端末にだけ保存されます。</p>
    <div class="g">
      <div><label for="c-owner">ユーザー名</label><input id="c-owner" autocomplete="off"></div>
      <div><label for="c-repo">リポジトリ</label><input id="c-repo" autocomplete="off"></div>
      <div><label for="c-branch">ブランチ</label><input id="c-branch" autocomplete="off"></div>
    </div>
    <div style="margin-top:.5rem"><label for="c-token">トークン</label><input id="c-token" type="password" autocomplete="off"></div>
    <div class="row"><button class="btn" id="connect" type="button">接続して読み込む</button><button class="btn ghost" id="reload" type="button">読み込み直す</button><span class="msg" id="conn-msg"></span></div>
  </section>

  <div id="board"></div>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="国力">国力</button><button role="tab" data-tab="統治">統治</button><button role="tab" data-tab="威信">威信</button><button role="tab" data-tab="省">省</button><button role="tab" data-tab="時間">時間</button><button role="tab" data-tab="設定">設定</button>
</nav>
<script>
"use strict";
/* 国力年報:毎朝の集計(docs/data/stats.json)を、非公開のリポジトリからトークンで読み、盤面に描く。
   図はすべて SVG で自前に描く(外の図の道具は使わない) */
const APP_VERSION = "2026-10-22 k13";
const KEY_CONN = "kokuryoku-conn", KEY_CACHE = "kokuryoku-cache", KEY_TAB = "kokuryoku-tab", KEY_CMP = "kokuryoku-cmp", KEY_RANGE = "kokuryoku-range";
const STATS_PATH = "docs/data/stats.json";
const GOV_PATH = "roadmap/gov/governance.json";   // 統治の計算の結果(行軍表が書き出す)
const PRE_PATH = "roadmap/gov/prestige.json";     // 威信の計算の結果(行軍表が書き出す)
const KEY_PSUB = "kokuryoku-psub";
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const sg = (v, n) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(n == null ? 1 : n);
const md = s => { const [, m, d] = String(s).split("-"); return (+m) + "/" + (+d); };
const hhmm = min => { const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? h + "時間" + (m ? m + "分" : "") : m + "分"; };
const tagOf = s => String(s || "").replace(/省$/, "");
const nameOfTag = t => /省$/.test(t) ? t : t + "省";

// 省アプリと同じ色(gold は国力の線の藍として使う)

/* ───── 見る期間・比べ方 ───── */
function rangeOf(d){
  const dates = (d.power_history || []).map(r => r.date); if (!dates.length) return null;
  const r = lsGet(KEY_RANGE, { mode: "30" }), lastD = dates[dates.length - 1], firstD = dates[0];
  let to = r.mode === "custom" && r.to ? r.to : lastD, from;
  if (r.mode === "custom" && r.from) from = r.from; else if (r.mode === "all") from = firstD;
  else from = new Date(Date.parse(to + "T00:00:00Z") - (+r.mode) * 864e5).toISOString().slice(0, 10);
  if (from < firstD) from = firstD;
  return { from, to, mode: r.mode };
}
const cut = (list, R) => (list || []).filter(x => x.date >= R.from && x.date <= R.to);
function causeRange(d){
  const dates = Array.from(new Set((d.ministry_history || []).map(x => x.date))).sort(); if (dates.length < 2) return null;
  const m = lsGet(KEY_CMP, { mode: "1" }), E = dates[dates.length - 1];
  const back = n => { const want = new Date(Date.parse(E + "T00:00:00Z") - n * 864e5).toISOString().slice(0, 10); return dates.filter(x => x <= want).pop() || dates[0]; };
  if (m.mode === "custom") return { from: m.from || back(7), to: m.to || E, mode: "custom" };
  if (m.mode === "1") return { from: dates[dates.length - 2], to: E, mode: "1" };
  return { from: back(+m.mode || 7), to: E, mode: m.mode };
}
const realOf = r => (r.real != null ? r.real : r.power);

/* ───── 何が国力を動かしたか(省ごと:領土・支配・重要度にシャープレイ値で割り振る) ───── */
function attribution(d, R){
  const mh = (d.ministry_history || []).filter(x => x.date >= R.from && x.date <= R.to); if (!mh.length) return null;
  const dates = Array.from(new Set(mh.map(x => x.date))).sort(), S = dates[0], E = dates[dates.length - 1];
  const at = day => { const m = {}; mh.filter(x => x.date === day).forEach(x => m[x.tag] = x); return m; };
  const A = at(S), B = at(E), tags = Array.from(new Set(Object.keys(A).concat(Object.keys(B))));
  const z = { territory: 0, dominance: 0, weight: 0, power: 0 };
  const rows = tags.map(tag => {
    const a = A[tag] || z, b = B[tag] || z, T0 = a.territory, D0 = a.dominance, W0 = a.weight, T1 = b.territory, D1 = b.dominance, W1 = b.weight;
    const sh = (dx, y0, z0, y1, z1) => dx * (y0 * z0 / 3 + (y0 * z1 + y1 * z0) / 6 + y1 * z1 / 3) / 100;
    return { tag, total: b.power - a.power, parts: [["領土", sh(T1 - T0, D0, W0, D1, W1)], ["支配", sh(D1 - D0, T0, W0, T1, W1)], ["重要度", sh(W1 - W0, T0, D0, T1, D1)]] };
  }).sort((x, y) => Math.abs(y.total) - Math.abs(x.total));
  return { S, E, rows };
}
/* タスクまで割り振る:省の国力 = 重要度 ÷ 100 × (タスクの点の合計)。2つの日の差を、タスク1つずつと重要度に分ける */
function taskAttribution(d, S, E){
  const ts = d.task_scores; if (!ts || !ts.days || !ts.days[S] || !ts.days[E]) return null;
  const ptsAt = day => { const m = {}; (ts.days[day] || []).forEach(([i, p]) => m[ts.names[i]] = p); return m; };
  const p0 = ptsAt(S), p1 = ptsAt(E), mh = d.ministry_history || [];
  const at = day => { const m = {}; mh.filter(x => x.date === day).forEach(x => m[x.tag] = x); return m; };
  const A = at(S), B = at(E), tags = Array.from(new Set(Object.keys(A).concat(Object.keys(B))));
  const changes = (d.task_changes || []).filter(x => x.date > S && x.date <= E);
  const reason = (name, a, b) => { const c = changes.filter(x => x.task === name).pop(); if (c) return c.from + "→" + c.to; if (!a && b) return "加わった"; if (a && !b) return "外れた"; return b > a ? "定着度が上がった" : "定着度が下がった"; };
  const byTask = {};
  const rows = tags.map(tag => {
    const a = A[tag] || { weight: 0, power: 0 }, b = B[tag] || { weight: 0, power: 0 };
    const names = Object.keys(ts.tags).filter(n => (ts.tags[n] || []).includes(tag) && (p0[n] || p1[n]));
    const s0 = names.reduce((x, n) => x + (p0[n] || 0), 0), s1 = names.reduce((x, n) => x + (p1[n] || 0), 0), wAvg = (a.weight + b.weight) / 2;
    const tasks = names.map(n => ({ name: n, v: ((p1[n] || 0) - (p0[n] || 0)) * wAvg / 100, why: reason(n, p0[n] || 0, p1[n] || 0) })).filter(x => Math.abs(x.v) >= 0.005).sort((x, y) => Math.abs(y.v) - Math.abs(x.v));
    const wPart = (b.weight - a.weight) * (s0 + s1) / 2 / 100;
    tasks.forEach(t => { (byTask[t.name] = byTask[t.name] || { name: t.name, v: 0, why: t.why, tags: [] }).v += t.v; byTask[t.name].tags.push(tag); });
    return { tag, total: b.power - a.power, tasks, wPart };
  }).sort((x, y) => Math.abs(y.total) - Math.abs(x.total));
  return { S, E, rows, tasks: Object.values(byTask).sort((x, y) => y.v - x.v) };
}

/* ───── 小さな図の部品 ───── */
const CW = () => Math.round(Math.max(300, Math.min(720, ($("board") && $("board").clientWidth) || 360)));
const niceStep = span => { const raw = span / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; };
function spark(vals, opt){
  opt = opt || {}; const W = opt.w || 160, H = opt.h || 30, xs = vals.filter(v => v != null);
  if (xs.length < 2) return '<svg class="' + (opt.cls || "sp") + '" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none"></svg>';
  let lo = Math.min(...xs), hi = Math.max(...xs); if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const X = i => 2 + i * (W - 4) / (vals.length - 1), Y = v => H - 3 - (v - lo) / (hi - lo) * (H - 6);
  const pts = vals.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const col = opt.color || COL.spark, last = pts[pts.length - 1];
  return '<svg class="' + (opt.cls || "sp") + '" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    (opt.area ? '<path d="' + line + " L" + last[0].toFixed(1) + " " + H + " L" + pts[0][0].toFixed(1) + " " + H + ' Z" fill="' + col + '" opacity=".1"/>' : "") +
    '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.4" fill="' + col + '"/></svg>';
}

/* 国力の推移:実質(金の線と面)・名目(点線)・計算方法の版(帯) */
function powerChart(hist, rules){
  const W = CW(), H = Math.round(Math.max(200, Math.min(260, W * 0.55))), L = 34, Rm = 44, T = 16, B = 24, iw = W - L - Rm, ih = H - T - B;
  const vals = hist.map(realOf), nom = hist.map(r => r.power), hasReal = hist.some(r => r.real != null);
  let lo = Math.min(...vals, ...(hasReal ? nom : [])), hi = Math.max(...vals, ...(hasReal ? nom : []));
  const pad = (hi - lo) * 0.12 || 1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const st = niceStep(hi - lo); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const X = i => L + (hist.length < 2 ? iw / 2 : i * iw / (hist.length - 1)), Y = v => T + ih - (v - lo) / (hi - lo) * ih;
  let g = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="国力の推移"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + COL.gold + '" stop-opacity=".18"/><stop offset="1" stop-color="' + COL.gold + '" stop-opacity="0"/></linearGradient></defs>';
  // 版の帯
  (rules || []).forEach((r, k) => {
    const i0 = hist.findIndex(h => h.date >= r.from); if (i0 < 0) return;
    const nx = rules[k + 1] ? hist.findIndex(h => h.date >= rules[k + 1].from) : -1, x0 = X(i0), x1 = nx < 0 ? L + iw : X(nx);
    if (x1 <= x0) return;
    g += '<rect x="' + x0.toFixed(1) + '" y="' + T + '" width="' + (x1 - x0).toFixed(1) + '" height="' + ih + '" fill="' + (k % 2 ? "#F4EFE4" : "#F8F5EE") + '"/>' +
      '<line x1="' + x0.toFixed(1) + '" y1="' + T + '" x2="' + x0.toFixed(1) + '" y2="' + (T + ih) + '" stroke="' + COL.line2 + '" stroke-dasharray="3 3"/>' +
      '<text x="' + (x0 + 4).toFixed(1) + '" y="' + (T + 12) + '" font-size="11" fill="' + COL.faint + '">' + esc(r.version) + "</text>";
  });
  for (let v = lo; v <= hi + 1e-9; v += st) g += '<line x1="' + L + '" y1="' + Y(v).toFixed(1) + '" x2="' + (L + iw) + '" y2="' + Y(v).toFixed(1) + '" stroke="' + COL.line + '"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" font-size="11" fill="' + COL.faint + '" text-anchor="end">' + (+v.toFixed(2)) + "</text>";
  const nT = Math.min(W < 480 ? 4 : 6, hist.length), used = new Set();
  for (let k = 0; k < nT; k++) { const i = Math.round(k * (hist.length - 1) / Math.max(1, nT - 1)); if (used.has(i)) continue; used.add(i);
    g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="11" fill="' + COL.faint + '" text-anchor="' + (k === 0 ? "start" : k === nT - 1 ? "end" : "middle") + '">' + md(hist[i].date) + "</text>"; }
  const path = arr => arr.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
  if (hasReal) g += '<path d="' + path(nom) + '" fill="none" stroke="' + COL.sub + '" stroke-width="1.3" stroke-dasharray="5 4" opacity=".7"/>';
  if (hist.length > 1) g += '<path d="' + path(vals) + " L" + X(vals.length - 1).toFixed(1) + " " + (T + ih) + " L" + X(0).toFixed(1) + " " + (T + ih) + ' Z" fill="url(#pg)"/>';
  g += '<path class="draw" d="' + path(vals) + '" fill="none" stroke="' + COL.gold + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  const li = vals.length - 1;
  g += '<circle cx="' + X(li).toFixed(1) + '" cy="' + Y(vals[li]).toFixed(1) + '" r="5" fill="' + COL.lacquer + '" stroke="' + COL.gold + '" stroke-width="2.4"/>' +
    '<text x="' + (X(li) + 8).toFixed(1) + '" y="' + (Y(vals[li]) + 4).toFixed(1) + '" font-size="13" font-weight="700" fill="' + COL.gold + '">' + vals[li].toFixed(1) + "</text>";
  return g + "</svg>";
}

/* 戦況盤:x=重要度、y=国力。円の大きさ=領土、まわりの金の弧=支配、斜めの線=全体の釣り合い。線より下は力が足りていない */
function boardSvg(fr, sel){
  const W = CW(), H = Math.round(Math.max(300, Math.min(460, W * 0.86))), L = 30, Rm = 16, T = 22, B = 34, iw = W - L - Rm, ih = H - T - B;
  const wmax = Math.max(1, ...fr.map(r => r.weight)) * 1.12, pmax = Math.max(1, ...fr.map(r => r.power)) * 1.18, tmax = Math.max(1, ...fr.map(r => r.territory || 0));
  const k = fr.reduce((a, r) => a + r.power, 0) / Math.max(1e-9, fr.reduce((a, r) => a + r.weight, 0));
  const X = v => L + v / wmax * iw, Y = v => T + ih - v / pmax * ih, rmax = Math.max(16, Math.min(30, W / 15));

  // 釣り合いの線と、足りない側の薄い影
  const xEnd = Math.min(wmax, pmax / k), yEnd = k * xEnd;
  g += '<path d="M' + X(0) + " " + Y(0) + " L" + X(xEnd).toFixed(1) + " " + Y(yEnd).toFixed(1) + " L" + X(wmax).toFixed(1) + " " + (xEnd < wmax ? Y(yEnd).toFixed(1) : Y(k * wmax).toFixed(1)) + " L" + X(wmax).toFixed(1) + " " + Y(0) + ' Z" fill="#FBF0EC"/>';
  g += '<line x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(xEnd).toFixed(1) + '" y2="' + Y(yEnd).toFixed(1) + '" stroke="' + COL.gold + '" stroke-width="1.2" stroke-dasharray="6 5" opacity=".7"/>';
  const lx = X(xEnd * 0.82), ly = Y(yEnd * 0.82), ang = Math.atan2(Y(yEnd) - Y(0), X(xEnd) - X(0)) * 180 / Math.PI;
  g += '<text x="' + lx.toFixed(1) + '" y="' + (ly - 6).toFixed(1) + '" font-size="11" fill="' + COL.gold + '" opacity=".85" transform="rotate(' + ang.toFixed(1) + " " + lx.toFixed(1) + " " + (ly - 6).toFixed(1) + ')" text-anchor="middle">釣り合い</text>';
  g += '<text x="' + (L + iw - 4) + '" y="' + (T + ih - 8) + '" font-size="11" fill="' + COL.down + '" text-anchor="end">力が足りない</text>';
  g += '<text x="' + (L + 6) + '" y="' + (T + 14) + '" font-size="11" fill="' + COL.up + '">力が余っている</text>';
  // 軸
  g += '<line x1="' + L + '" y1="' + (T + ih) + '" x2="' + (L + iw) + '" y2="' + (T + ih) + '" stroke="' + COL.line2 + '"/><line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (T + ih) + '" stroke="' + COL.line2 + '"/>';
  g += '<text x="' + (L + iw) + '" y="' + (H - 12) + '" font-size="11.5" fill="' + COL.sub + '" text-anchor="end">重要度 →</text>';
  g += '<text x="' + (L - 12) + '" y="' + (T + 2) + '" font-size="11.5" fill="' + COL.sub + '" transform="rotate(-90 ' + (L - 12) + " " + (T + 2) + ')" text-anchor="end">国力 →</text>';
  // 円(大きいものを下に)。重なる円があるときは、名前を相手と反対側の外に出す
  const P = fr.map(r => ({ r, x: X(r.weight), y: Y(r.power), rad: 7 + (rmax - 7) * Math.sqrt((r.territory || 0) / tmax) }));
  P.forEach(p => { let nb = null, best = 0; P.forEach(q => { if (q === p) return; const dd = Math.hypot(q.x - p.x, q.y - p.y), ov = p.rad + q.rad + 6 - dd; if (ov > best) { best = ov; nb = q; } });
    if (nb) { let ax = p.x - nb.x, ay = p.y - nb.y; const n = Math.hypot(ax, ay) || 1; ax /= n; ay /= n; if (Math.abs(ay) < 0.35) { ay = -0.6; } const dist = p.rad + 14; p.lx = p.x + ax * dist; p.ly = p.y + ay * dist + 4; } });
  P.slice().sort((a, b) => b.rad - a.rad).forEach(p => {
    const r = p.r, x = p.x, y = p.y, rad = p.rad, ratio = r.weight > 0 ? r.power / (k * r.weight) : 1;
    const col = colorOf(r.ministry), low = ratio < 0.6, dom = Math.max(0, Math.min(1, (r.dominance || 0) / 100)), C2 = 2 * Math.PI * (rad + 4), on = !sel || sel === tagOf(r.ministry);
    g += '<g class="bub" data-min="' + esc(tagOf(r.ministry)) + '" opacity="' + (on ? 1 : .2) + '">' +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + rad.toFixed(1) + '" fill="' + col + '" fill-opacity="' + (sel === tagOf(r.ministry) ? ".4" : ".18") + '" stroke="' + col + '" stroke-width="' + (sel === tagOf(r.ministry) ? 3 : 2) + '"/>' +
      (low ? '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (rad + 9).toFixed(1) + '" fill="none" stroke="' + COL.down + '" stroke-width="1.2" stroke-dasharray="3 3"/>' : "") +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (rad + 4).toFixed(1) + '" fill="none" stroke="' + COL.line2 + '" stroke-width="2"/>' +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (rad + 4).toFixed(1) + '" fill="none" stroke="' + COL.text + '" stroke-width="2.2" stroke-dasharray="' + (C2 * dom).toFixed(1) + " " + C2.toFixed(1) + '" transform="rotate(-90 ' + x.toFixed(1) + " " + y.toFixed(1) + ')" stroke-linecap="round" opacity=".7"/>' +
      (p.lx != null ? '<text x="' + p.lx.toFixed(1) + '" y="' + p.ly.toFixed(1) + '" font-size="11.5" font-weight="700" fill="' + COL.text + '" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">' + esc(tagOf(r.ministry)) + "</text>"
        : rad >= tagOf(r.ministry).length * 6 + 2 ? '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" font-size="12" font-weight="700" fill="' + COL.text + '" text-anchor="middle">' + esc(tagOf(r.ministry)) + "</text>"
        : '<text x="' + x.toFixed(1) + '" y="' + (y - rad - 8).toFixed(1) + '" font-size="11.5" font-weight="700" fill="' + COL.text + '" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">' + esc(tagOf(r.ministry)) + "</text>") +
      (on && sel ? '<text x="' + x.toFixed(1) + '" y="' + (y + rad + 18).toFixed(1) + '" font-size="11" fill="' + COL.sub + '" text-anchor="middle">国力 ' + r.power.toFixed(1) + " ・ 重要度 " + r.weight.toFixed(1) + "</text>" : "") + "</g>";
  });
  return g + "</svg>";
}

/* ───── 統治:場面ごとに、株価のように値が動く ─────
   ○なら 値 + (100 − 値) × 割合、×なら 値 − 値 × 割合。割合 = そのタスクの重み ÷ 全タスクの重み。
   要素ごと・防復・安寧・統治が、それぞれ同じ出来事から別々に動く(足し合わせる比率は使わない) */
// 格:割合を威信と同じEloの目盛りに直したもの(0 が五分五分、マイナスは崩れるほうが多い=荒れている)
const gradeOf = v => v == null ? null : Math.round(400 * Math.log10(Math.max(1e-6, Math.min(100 - 1e-6, v)) / (100 - Math.max(1e-6, Math.min(100 - 1e-6, v)))));
const gtxt = g => g == null ? "—" : (g > 0 ? "+" : g < 0 ? "−" : "") + Math.abs(g);
// 威信の割合:五分五分の挑戦(ふつうの人が半々で成功する難しさ)を、今の自分が成し遂げられる見込み
const prePct = r => r == null ? null : 100 / (1 + Math.pow(10, -r / 400));
const GOV_EL = { "防復": ["被害を抑える", "初動", "修復", "補填"], "安寧": ["継続", "立ち直り", "取り戻し", "要石", "先回り"] };
function computeGov(raw){
  if (!raw || !raw.days) return null;
  const dates = Object.keys(raw.days).sort(), W = raw.weights || {}, tags = raw.tags || {};
  const totalW = Object.values(W).reduce((a, b) => a + b, 0) || 1, share = n => (W[n] || 1) / totalW;
  const keys = ["統治", "防復", "安寧"].concat(GOV_EL["防復"], GOV_EL["安寧"]), val = {}, series = {}, scenes = [];
  keys.forEach(k => { val[k] = null; series[k] = []; });
  const move = (k, ok, r) => { if (val[k] == null) val[k] = 50; r = Math.min(0.999, r); val[k] = ok ? val[k] + (100 - val[k]) * r : val[k] - val[k] * r; };
  const scene = (d, el, ok, r, what) => { const grp = GOV_EL["防復"].includes(el) ? "防復" : "安寧"; move(el, ok, r); move(grp, ok, r); move("統治", ok, r); scenes.push({ d, el, grp, ok, what, r }); };
  const prev = {}, deficit = {}, missRun = {};
  dates.forEach(d => {
    const day = raw.days[d], rec = day.tasks || {};
    const alerts = (raw.alerts || []).filter(a => a.from <= d && d <= a.to);
    // 防復:初動(ALERTの始まりの日)
    (raw.alerts || []).filter(a => a.from === d).forEach(a => {
      const tw = Object.keys(tags).filter(n => (tags[n] || []).some(t => a.targets.includes(t))).reduce((x, n) => x + (W[n] || 1), 0) / totalW;
      scene(d, "初動", a.first_action === d, tw, a.label);
    });
    Object.keys(rec).forEach(n => {
      const ratio = rec[n], ok = ratio >= 1, r = share(n);
      // 安寧:継続・立ち直り
      if (prev[n] === true) scene(d, "継続", ok, r, n);
      else if (prev[n] === false) scene(d, "立ち直り", ok, r, n);
      // 安寧:取り戻し(足りなかった分を、次に足りなくなる前に上乗せで埋めたか)
      if (ratio < 1) { if (deficit[n] > 0) scene(d, "取り戻し", false, r, n); deficit[n] = 1 - ratio; }
      else if (ratio > 1 && deficit[n] > 0) { deficit[n] -= ratio - 1; if (deficit[n] <= 1e-9) { scene(d, "取り戻し", true, r, n); deficit[n] = 0; } }
      // 安寧:要石
      if ((raw.keystones || []).includes(n)) scene(d, "要石", ok, r, n);
      // 防復:被害を抑える(ALERTの対象の省のタスク)・修復(ALERT中に3回続けて落ちたタスクが、ALERT中に戻ったか)
      const hit = alerts.find(a => (tags[n] || []).some(t => a.targets.includes(t)));
      if (hit) {
        scene(d, "被害を抑える", ok, r, n);
        missRun[n] = ok ? 0 : (missRun[n] || 0) + 1;
        if (missRun[n] === 3) missRun[n + "@fall"] = hit;
      }
      if (ok && missRun[n + "@fall"]) { scene(d, "修復", true, r, n); delete missRun[n + "@fall"]; }
      prev[n] = ok;
    });
    // ALERTが終わるまでに戻らなかったタスクは、修復×
    (raw.alerts || []).filter(a => a.to === d).forEach(a => Object.keys(missRun).filter(k => k.endsWith("@fall") && missRun[k] === a).forEach(k => { scene(d, "修復", false, share(k.slice(0, -5)), k.slice(0, -5)); delete missRun[k]; }));
    // 防復:補填(賠償計画)
    if (day.comp) scene(d, "補填", !!day.comp.done, Object.keys(tags).filter(n => (tags[n] || []).includes(day.comp.ministry)).reduce((x, n) => x + (W[n] || 1), 0) / totalW, day.comp.ministry + "の賠償計画");
    // 安寧:先回り(実際に来た脅威を、朝の偵察で挙げていたか)
    (day.threats || []).forEach(t => scene(d, "先回り", !!t.foreseen, (t.tasks || []).reduce((x, n) => x + share(n), 0), t.threat));
    keys.forEach(k => series[k].push(val[k]));
  });
  return { dates, series, val, scenes };
}

  const ms = (P.items || []).slice().reverse();
  h += '<section class="sect"><h3>これまでの実績<small>' + ms.length + "件 ・ 新しい順</small></h3>" + (ms.length ? ms.map(m => { const broke = m.kind !== "偉業" && m.s < 1, v = m.kind === "偉業" ? m.w : (broke ? -(m.w * (1 - m.s)) : m.w * m.s);

  const m = lsGet(KEY_CMP, { mode: "1" }), CR = causeRange(d);
  let h = '<section class="sect"><h3>何が国力を動かしたか</h3><div class="chips" data-chips="cmp">' +

    "</div>" + (m.mode === "custom" && CR ? '<div class="dates"><input type="date" id="c-from" value="' + CR.from + '"> 〜 <input type="date" id="c-to" value="' + CR.to + '"></div>' : "");

  const days = new Set(mh.map(x => x.date)).size;
  if (days < 2) return h + '<div class="empty">国力の記録がまだ' + days + "日分です。2日分そろうと比べられます。</div></section>";
  const at = CR && attribution(d, CR);
  if (!at || at.S === at.E) return h + '<div class="empty">この期間には、比べられる2日分の記録がありません。期間を広げてください。</div></section>';
  const ta = taskAttribution(d, at.S, at.E), sum = at.rows.reduce((x, r) => x + r.total, 0);
  // 一番上:差し引きと、いちばん効いたもの
  let top = null;
  if (ta) { const cand = ta.tasks.map(t => ({ label: t.name, v: t.v })).concat(ta.rows.map(r => ({ label: nameOfTag(r.tag) + "の重要度", v: r.wPart }))); cand.sort((a, b) => Math.abs(b.v) - Math.abs(a.v)); top = cand[0]; }
  else { const all = []; at.rows.forEach(r => r.parts.forEach(([k, v]) => all.push({ label: nameOfTag(r.tag) + "の" + k, v }))); all.sort((a, b) => Math.abs(b.v) - Math.abs(a.v)); top = all[0]; }
  h += '<div class="vd"><span class="vd-d">' + md(at.S) + " → " + md(at.E) + '</span><span class="vd-n num ' + (sum >= 0 ? "up" : "down") + '">' + sg(sum) + "</span></div>" +
    (top && Math.abs(top.v) >= 0.05 ? '<p class="vd-top">いちばん効いたのは <b>' + esc(top.label) + '</b> <span class="' + (top.v >= 0 ? "up" : "down") + '">' + sg(top.v) + "</span></p>" : "");
  // 綱引き:押し上げた合計と押し下げた合計
  const items = ta ? ta.tasks.filter(t => Math.abs(t.v) >= 0.05).map(t => ({ name: t.name, v: t.v, tag: t.tags[0], why: t.why }))
                   : [].concat(...at.rows.map(r => r.parts.filter(p => Math.abs(p[1]) >= 0.05).map(p => ({ name: nameOfTag(r.tag) + "の" + p[0], v: p[1], tag: r.tag, why: "" }))));
  if (ta) ta.rows.forEach(r => { if (Math.abs(r.wPart) >= 0.05) items.push({ name: nameOfTag(r.tag) + "の重要度", v: r.wPart, tag: r.tag, why: "" }); });
  const upSum = items.filter(x => x.v > 0).reduce((a, x) => a + x.v, 0), dnSum = -items.filter(x => x.v < 0).reduce((a, x) => a + x.v, 0);
  if (upSum + dnSum > 0) h += '<div class="tug"><div class="tug-bar"><i class="u" style="width:' + (upSum / (upSum + dnSum) * 100).toFixed(1) + '%"></i><i class="d" style="width:' + (dnSum / (upSum + dnSum) * 100).toFixed(1) + '%"></i></div>' +
    '<div class="tug-l"><span class="up">押し上げ ' + sg(upSum) + '</span><span class="down">押し下げ ' + sg(-dnSum) + "</span></div></div>";
  // 1行に1つ:省の色の点・名前・左右に伸びる棒・数字
  const isMove = w => w && w.includes("→");
  const row = (x, mx) => '<div class="cr"><span class="cr-n"><i style="background:' + colorOf(x.tag || "") + '"></i>' + esc(x.name) + (isMove(x.why) ? '<em>' + esc(x.why) + "</em>" : "") + "</span>" +
    '<span class="cr-b"><span class="cr-l">' + (x.v < 0 ? '<i style="width:' + (Math.abs(x.v) / mx * 100).toFixed(1) + '%"></i>' : "") + '</span><span class="cr-r">' + (x.v > 0 ? '<i style="width:' + (x.v / mx * 100).toFixed(1) + '%"></i>' : "") + "</span></span>" +
    '<span class="cr-v num ' + (x.v >= 0 ? "up" : "down") + '">' + sg(x.v) + "</span></div>";
  const pos = items.filter(x => x.v > 0).sort((a, b) => b.v - a.v), neg = items.filter(x => x.v < 0).sort((a, b) => a.v - b.v);
  const mx = Math.max(0.01, ...items.map(x => Math.abs(x.v)));
  const restNote = (rest, word) => rest.length ? '<div class="cr-more">ほか' + rest.length + "件 " + sg(rest.reduce((a, x) => a + x.v, 0)) + "</div>" : "";
  if (pos.length) h += '<div class="subh">押し上げた</div>' + pos.slice(0, 5).map(x => row(x, mx)).join("") + restNote(pos.slice(5));
  if (neg.length) h += '<div class="subh">押し下げた</div>' + neg.slice(0, 5).map(x => row(x, mx)).join("") + restNote(neg.slice(5));
  // 省ごと:同じ1行の形
  const rows = (ta ? ta.rows : at.rows).filter(r => Math.abs(r.total) >= 0.05), mxR = Math.max(0.01, ...rows.map(r => Math.abs(r.total)));
  h += '</section><section class="sect"><h3>省ごと</h3>' + (rows.length ? rows.map(r => row({ name: nameOfTag(r.tag), v: r.total, tag: r.tag, why: "" }, mxR)).join("") : '<div class="empty">目立って動いた省はありません。</div>') + "</section>";
  // 状況が変わったタスク
  const RANK = { "要再設定": 0, "新規": 1, "進行中": 2, "定着": 3, "熟達": 4, "殿堂入り": 5 };
  const ch = (d.task_changes || []).filter(x => x.date > at.S && x.date <= at.E).slice().reverse();
  h += '<section class="sect"><h3>状況が変わったタスク<small>' + ch.length + "件</small></h3>" + (ch.length ? '<div class="moves">' + ch.map(x => {
    const dir = RANK[x.to] != null && RANK[x.from] != null ? (RANK[x.to] > RANK[x.from] ? "up" : RANK[x.to] < RANK[x.from] ? "down" : "") : "";
    return '<div class="move"><span class="t">' + esc(x.task) + '</span><span class="st">' + esc(x.from) + '</span><span class="arw">→</span><span class="st to ' + dir + '">' + esc(x.to) + '</span><span class="dt">' + md(x.date) + "</span></div>"; }).join("") + "</div>"
    : '<div class="empty">この期間に状況が変わったタスクはありません。</div>') + "</section>";
  return h;
}

/* 省のタブ:戦況盤・省ごとの札・国力の内訳 */
function ministriesTab(d){
  const fr = d.front || [], R = rangeOf(d), mh = R ? cut(d.ministry_history, R) : (d.ministry_history || []);
  let h = '<section class="sect"><h3>戦況盤<small>円の大きさ=領土 ・ まわりの墨の弧=支配 ・ 朱の点線の輪=力が足りない ・ 押すと省を選ぶ</small></h3>';
  if (!fr.length) return h + '<div class="empty">国力を計算すると、盤面が描かれます。</div></section>';
  h += '<div class="board" id="bd">' + boardSvg(fr, SEL) + "</div>";
  const k = fr.reduce((a, r) => a + r.power, 0) / Math.max(1e-9, fr.reduce((a, r) => a + r.weight, 0));
  const tmax = Math.max(1, ...fr.map(r => r.territory || 0)), wmax = Math.max(1, ...fr.map(r => r.weight));
  const wMed = fr.map(r => r.weight).sort((a, b) => a - b)[Math.floor(fr.length / 2)] || 0;
  const gapOf = r => { const rel = r.weight > 0 ? r.power / (k * r.weight) : 1;
    if (r.weight >= wMed && rel < 0.35) return ["idle", "手つかず:" + ((r.territory || 0) < 1 ? "タスクが無い" : "動いていない")];
    if ((r.territory || 0) >= 5 && (r.dominance || 0) < 5) return ["thin", "広げすぎ:治めきれていない"];
    if (rel > 1.6 && r.power >= 3) return ["over", "振りすぎ:ほかに回せる"]; return null; };
  h += '<div class="mins">' + fr.slice().sort((a, b) => b.power - a.power).map(r => {
    const tag = tagOf(r.ministry), ratio = r.weight > 0 ? r.power / (k * r.weight) : 1, cls = ratio < 0.6 ? "lo" : ratio > 1.4 ? "hi" : "ok", gp = gapOf(r);
    const s = mh.filter(x => x.tag === tag).map(x => x.power);
    return '<div class="min ' + cls + (SEL === tag ? " sel" : "") + '" data-min="' + esc(tag) + '" style="--mc:' + colorOf(tag) + '"><div class="hd"><b>' + esc(nameOfTag(tag)) + (cls === "lo" ? '<span class="lowtag">力不足</span>' : "") + '</b><span class="p num">' + r.power.toFixed(1) + "</span></div>" +
      spark(s, { area: true }) +
      '<div class="mt"><span>領土</span><i><b style="width:' + ((r.territory || 0) / tmax * 100).toFixed(0) + '%"></b></i><span class="num">' + (+(r.territory || 0)).toFixed(1) + "</span>" +
      '<span>支配</span><i><b style="width:' + Math.min(100, r.dominance || 0).toFixed(0) + '%"></b></i><span class="num">' + (+(r.dominance || 0)).toFixed(0) + "</span>" +
      '<span>重要度</span><i><b style="width:' + (r.weight / wmax * 100).toFixed(0) + '%"></b></i><span class="num">' + r.weight.toFixed(1) + "</span></div>" +
      (gp ? '<span class="tag ' + gp[0] + '">' + esc(gp[1]) + "</span>" : "") + "</div>";
  }).join("") + "</div></section>";
  // 国力の内訳
  const ml = (d.ministry_latest || []).filter(r => r.power > 0).sort((a, b) => b.power - a.power), tot = ml.reduce((a, r) => a + r.power, 0);
  if (ml.length) h += '<section class="sect"><h3>国力の内訳<small>省ごとの取り分</small></h3><div class="share">' +
    ml.map(r => '<i style="width:' + (r.power / tot * 100).toFixed(2) + "%;background:" + colorOf(r.ministry) + '" title="' + esc(nameOfTag(tagOf(r.ministry))) + '"></i>').join("") + '</div><div class="share-l">' +
    ml.map(r => '<span><i style="background:' + colorOf(r.ministry) + '"></i>' + esc(nameOfTag(tagOf(r.ministry))) + "<b>" + (r.power / tot * 100).toFixed(0) + "%</b></span>").join("") + "</div></section>";
  return h;
}

/* 時間のタブ */
function timeTab(d){
  const tm = (d.time_by_ministry || []).slice().sort((a, b) => b.minutes - a.minutes), tot = tm.reduce((a, r) => a + r.minutes, 0);
  let h = '<section class="sect"><h3>今週の時間<small>開始と終了を記録した分 ・ 合計 ' + (tot ? hhmm(tot) : "0分") + "</small></h3>";
  h += tm.length ? '<div class="share">' + tm.map(r => '<i style="width:' + (r.minutes / tot * 100).toFixed(2) + "%;background:" + colorOf(r.ministry) + '"></i>').join("") + '</div><div class="share-l">' +
    tm.map(r => '<span><i style="background:' + colorOf(r.ministry) + '"></i>' + esc(nameOfTag(tagOf(r.ministry))) + "<b>" + hhmm(r.minutes) + "</b></span>").join("") + "</div>"
    : '<div class="empty">開始と終了を記録すると、省ごとの配分が出ます。</div>';
  h += "</section>";
  // 日別
  const td = d.time_by_day || [];
  h += '<section class="sect"><h3>日ごとの合計</h3>';
  if (td.length) {
    const W = CW(), H = 170, L = 32, T = 14, B = 24, iw = W - L - 8, ih = H - T - B, mx = Math.max(60, ...td.map(r => r.minutes)), st = Math.max(30, niceStep(mx / 60) * 60), top = Math.ceil(mx / st) * st;   // 目盛りは時間のきりのいい値
    const bw = iw / td.length, avg = td.reduce((a, r) => a + r.minutes, 0) / td.length, Y = v => T + ih - v / top * ih;
    let g = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="日ごとの合計時間">';
    for (let v = 0; v <= top; v += st) g += '<line x1="' + L + '" x2="' + (L + iw) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="' + COL.line + '"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" font-size="11" fill="' + COL.faint + '" text-anchor="end">' + (v % 60 ? (v / 60).toFixed(1) : v / 60) + "h</text>";
    td.forEach((r, i) => { const x = L + i * bw + bw * 0.18, w = bw * 0.64;
      g += '<rect x="' + x.toFixed(1) + '" y="' + Y(r.minutes).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + (T + ih - Y(r.minutes)).toFixed(1) + '" rx="2" fill="' + (r.minutes >= avg ? COL.gold : COL.line2) + '"/>';
      if (td.length * 34 <= iw || i % Math.ceil(td.length * 34 / iw) === 0) g += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 6) + '" font-size="10.5" fill="' + COL.faint + '" text-anchor="middle">' + md(r.date) + "</text>"; });
    g += '<line x1="' + L + '" x2="' + (L + iw) + '" y1="' + Y(avg).toFixed(1) + '" y2="' + Y(avg).toFixed(1) + '" stroke="' + COL.gold + '" stroke-dasharray="5 4"/><text x="' + (L + iw) + '" y="' + (Y(avg) - 5).toFixed(1) + '" font-size="11" fill="' + COL.gold + '" text-anchor="end">平均 ' + hhmm(avg) + "</text>";
    h += g + "</svg>";
  } else h += '<div class="empty">記録がある日から順に積み上がります。</div>';
  h += "</section>";
  // タスク別の所要時間(短くなっていれば世代を上げる頃合い)
  const ts = d.task_time_series || [];
  h += '<section class="sect"><h3>タスクの所要時間<small>短くなっていれば、世代を上げる頃合い</small></h3>';
  h += ts.length ? '<div class="tasks">' + ts.map(s => { const p = s.points, a = p[0] ? p[0].minutes : 0, b = p.length ? p[p.length - 1].minutes : 0, ch = a > 0 ? (b - a) / a * 100 : 0;
      return '<div class="tk"><b>' + esc(s.task) + "</b>" + spark(p.map(x => x.minutes), { h: 32 }) + '<div class="r"><span>' + hhmm(a) + " → " + hhmm(b) + '</span><span class="' + (b <= a ? "up" : "down") + '">' + sg(ch, 0) + "%</span></div></div>"; }).join("") + "</div>"
    : '<div class="empty">同じタスクを2回以上計ると、推移が出ます。</div>';
  return h + "</section>";
}

/* 裏画面:計算式 */

        ["重要度の物価", "重要度の合計が膨らんだ分。実質国力はこれで割って、膨らみを取り除く"]]) +
      note("要因のタブの割り振りは、2つの日の差を、領土・支配・重要度(タスクまで分けるときは、タスクの点と重要度)にシャープレイ値で分けたもの。")) +
    f("重要度と時勢(省アプリ)", eq("プラスの時勢:焦燥 = 熱量 × 色 ÷ 10、純粋 = 熱量 ×(1 − 色 ÷ 10)\nマイナスの時勢:安心 = −熱量 × 確かさ(はっきり 1・なんとなく 0.6)\n\nその日に効いている量 = 大きさ × min(1, 経った日数 ÷ 漠然さの日数)× 打ち消しの残り\n気持ちの相場 = 3 ÷(5 + 抱えている熱量の合計)\n重要度の目標 = 気持ちの相場 ×(焦燥 + 信用 × 純粋 + 安心)× 省の割合\n重要度は、目標へ毎日1割ずつ近づく") +
      tbl(["項目", "値"], [["漠然さ", "その日だけ 1日・3日・1週間 7日・1か月 30日"], ["打ち消し", "残り ×(1 − 割合)。少し 0.25・半分 0.5・ほとんど 0.9"], ["信用", "やりたい気持ちを書いたあと、その省で計画が動いた割合(純粋の分にだけ掛かる)"], ["しんどさ", "重要度には入れず、別に記録"]])) +
    f("統治", eq("場面ごとに、株価のように値が動く(上限100)\n○なら:値 +(100 − 値)× 割合\n×なら:値 − 値 × 割合\n割合 = そのタスクの重み ÷ 全タスクの重み\n\n要素・防復・安寧・統治は、それぞれ同じ場面から別々に動く\n(防復は防復の要素の場面だけ、安寧は安寧の要素の場面だけ、統治はすべての場面)\n何も分かっていないうちは五分五分(50%)から始まる\n\n格 = 400 × log10(割合 ÷(100 − 割合))\n(威信と同じEloの目盛り。0 が五分五分、マイナスは崩れるほうが多い=荒れている。上に行くほど1つ上がる重みが大きくなる)") +
      tbl(["", "要素", "場面", "○(乗り切った)"], [
        ["防復", "被害を抑える", "ALERTのあいだ、対象の省で予定されていたタスク", "行えた"],
        ["防復", "初動", "ALERTが起きた日(割合は対象の省のタスクの重み)", "その日のうちに最初の対応に手を付けた"],
        ["防復", "修復", "ALERTのあいだに3回続けて落ちたタスク", "ALERTが終わるまでに再び行えた"],

        ["懸け具合", "その偉業に効いている熱量 ÷ 心が抱えている熱量の合計(時勢と偉業のすべて)。心の取り分。挑戦していたあいだの平均"],
        ["届く見込み", "偉業への気持ちの記録で付けた見込みの、挑戦していたあいだの平均(記録は次の記録まで続く)。付けていない偉業は、宣言した日までの結びついたタスクの実行の割合"],
        ["見込みの直し", "自分で見込みを付けて終えた偉業の当たり具合で直す:見込み ×(成し遂げた割合 ÷ 付けた見込みの平均)。成し遂げた割合は(成し遂げた数 + 1)÷(終えた数 + 2)、付けた見込みの平均は(合計 + 0.5)÷(終えた数 + 1)。低めに付けて成功し続けると、見込みが引き上げられ、難しさが下がる"],
        ["結果", "偉業は省アプリで終えるときに付けた成功・失敗・途中まで(%)。作戦期の目標は期日に記録した値 ÷ 目標の値、RAIDは期限までに制圧・引き渡し、ALERTは期限までに収束"],
        ["統治", "上の統治の割合(その日の値)"]]) +
      note("計算は行軍表が行い、roadmap/gov/prestige.json に書き出したものを、ここで表示しています。")) +
    note("毎朝の計算(GitHub Actions)の中の細かい式は、その仕組みのファイルを見せてもらえれば、ここにそのまま載せられます。");
}

/* 設定のタブ */
function settingsHtml(d){
  if (SHOW_FORMULA) return formulaHtml();
  const rl = d ? (d.rules || []) : [];
  return '<section class="sect"><h3>計算方法の版<small>国力のグラフの帯と対応する</small></h3>' +
    (rl.length ? rl.slice().reverse().map(r => '<div class="rule-row"><span class="v">' + esc(r.version) + '<i style="background:' + esc(r.color || COL.gold) + '"></i></span><span>' + esc(r.change) + " <small>" + esc(r.from) + "から" + (r.impact ? " ・ 影響 " + esc(r.impact) : "") + (r.why ? " ・ " + esc(r.why) : "") + "</small></span></div>").join("")
      : '<div class="empty">計算方法を変えたら記録すると、ここと国力のグラフの帯に出ます。</div>') + "</section>" +
    '<section class="sect"><h3>どこで直すか</h3><p class="lead" style="font-size:.85rem">時勢は日々の記録から、省とその依存先は省アプリで直します。どれも翌朝の計算から年報に入ります。</p></section>' +

}

function b64utf8(b64){ const bin = atob(String(b64).replace(/\s/g, "")), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
async function load(){

  const headers = { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json" };
  try {
    const r = await fetch(url, { headers, cache: "no-store" });
    if (r.status === 401) throw new Error("トークンが無効です。設定の接続から入れ直してください。");
    if (r.status === 404) throw new Error("集計(" + STATS_PATH + ")が見つかりません。毎朝の計算が一度動くまで待ってください。");
    if (!r.ok) throw new Error("GitHubとの通信に失敗しました(" + r.status + ")。");
    const meta = await r.json();
    let text; if (meta.content) text = b64utf8(meta.content);
    else { const raw = await fetch(url, { headers: Object.assign({}, headers, { "Accept": "application/vnd.github.raw+json" }), cache: "no-store" }); text = await raw.text(); }
    DATA = JSON.parse(text);
    // 統治:行軍表が書き出した計算の結果を読む(まだ無ければ準備中のまま)
    try { const gu = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/contents/" + GOV_PATH + "?ref=" + encodeURIComponent(c.branch || "main");
      const gr = await fetch(gu, { headers, cache: "no-store" }); if (gr.ok) { const gm = await gr.json(); if (gm.content) DATA.gov_file = JSON.parse(b64utf8(gm.content)); } } catch (e) {}
    try { const pu = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/contents/" + PRE_PATH + "?ref=" + encodeURIComponent(c.branch || "main");
      const prr = await fetch(pu, { headers, cache: "no-store" }); if (prr.ok) { const pm = await prr.json(); if (pm.content) DATA.pre_file = JSON.parse(b64utf8(pm.content)); } } catch (e) {}
    lsSet(KEY_CACHE, DATA); render();
    if (msg) { msg.classList.remove("err"); msg.textContent = "読み込みました"; }
    return true;
  } catch (e) {
    if (msg) { msg.classList.add("err"); msg.textContent = e.message; }
    const st = $("stamp"); if (st) st.textContent = e.message;
    return false;
  }
}

<script>

/* ───── 効果音(省・行軍表・関所と同じ音。入/切と音量はアプリどうしで共通) ───── */

// ───────── 効果音(ブラウザの中で音を合成。音のファイルは使わない)─────────
// 設定(入/切・音量)は 3つのアプリで共通(localStorage の se-on / se-vol)
const SE = (() => {
  let ctx = null, master = null, lastTap = 0, lastErr = 0;
  const ls = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  let on = ls("se-on", "1") !== "0", vol = Math.max(0, Math.min(1, +ls("se-vol", "0.5")));
  function ac(){
    if (!on) return null;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); }
    if (ctx.state === "suspended") ctx.resume();
    master.gain.value = vol * 0.9;
    return ctx;
  }
  // 1つの音:周波数 f(滑らせるなら f2)、始まり t、長さ d、波の形、大きさ g
  function note(c, f, t, d, o){
    o = o || {};
    const osc = c.createOscillator(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + d);
    const g = o.g == null ? 0.2 : o.g, a = o.a == null ? 0.005 : o.a;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + a);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    let last = gn;
    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = o.lp; gn.connect(fl); last = fl; }
    osc.connect(gn); last.connect(master); osc.start(t0); osc.stop(t0 + d + 0.05);
  }
  // 鐘のような音(基音 + 倍音)
  const bell = (c, f, t, d, g) => { note(c, f, t, d, { g: g }); note(c, f * 2, t, d * 0.6, { g: g * 0.35 }); note(c, f * 3.01, t, d * 0.3, { g: g * 0.12 }); };
  // ざわめき(風・波)
  function noise(c, t, d, o){
    o = o || {};
    const n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    src.buffer = buf; fl.type = o.type || "lowpass"; fl.Q.value = o.q || 0.7;
    fl.frequency.setValueAtTime(o.f || 400, t0); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + d * 0.8);
    const g = o.g || 0.08;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + d * 0.35); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t0); src.stop(t0 + d + 0.05);
  }
  const lib = {
    tap: c => note(c, 880, 0, 0.05, { f2: 660, g: 0.05 }),
    tab: c => { note(c, 520, 0, 0.07, { type: "triangle", g: 0.07 }); note(c, 780, 0.03, 0.06, { type: "triangle", g: 0.04 }); },
    toggleOn: c => note(c, 600, 0, 0.08, { f2: 1150, g: 0.08 }),
    toggleOff: c => note(c, 900, 0, 0.08, { f2: 480, g: 0.06 }),
    done: c => { bell(c, 1046.5, 0, 0.45, 0.11); bell(c, 1318.5, 0.08, 0.6, 0.11); },
    save: c => { bell(c, 784, 0, 0.35, 0.08); bell(c, 1174.7, 0.01, 0.4, 0.06); },
    remove: c => note(c, 520, 0, 0.14, { f2: 240, type: "triangle", g: 0.08 }),
    error: c => { note(c, 220, 0, 0.09, { type: "square", g: 0.05, lp: 900 }); note(c, 196, 0.12, 0.12, { type: "square", g: 0.05, lp: 900 }); },
    open: c => noise(c, 0, 0.18, { f: 300, f2: 2400, type: "bandpass", q: 1.2, g: 0.05 }),
    fanfare: c => { [523.25, 659.25, 783.99].forEach((f, i) => { note(c, f, i * 0.09, 0.3, { type: "triangle", g: 0.12 }); note(c, f * 2, i * 0.09, 0.2, { g: 0.03 }); });
      bell(c, 1046.5, 0.27, 1.1, 0.13); note(c, 523.25, 0.27, 1.0, { type: "triangle", g: 0.06 });
      [2093, 2637, 3136, 2637].forEach((f, i) => note(c, f, 0.45 + i * 0.07, 0.25, { g: 0.025 })); },
    levelup: c => { note(c, 600, 0, 0.5, { f2: 1600, type: "triangle", g: 0.08 }); [1568, 1975.5, 2349.3, 3136].forEach((f, i) => bell(c, f, 0.35 + i * 0.06, 0.4, 0.04)); },
    issue: c => { [392, 523.25, 659.25, 783.99].forEach((f, i) => note(c, f, i * 0.12, i === 3 ? 0.9 : 0.22, { type: "sawtooth", g: 0.07, lp: 1800, a: 0.02 }));
      note(c, 196, 0.36, 0.9, { type: "sawtooth", g: 0.04, lp: 700, a: 0.03 }); },
    swell: c => { noise(c, 0, 0.9, { f: 200, f2: 1400, g: 0.05 }); [440, 554.4, 659.3].forEach(f => note(c, f, 0.05, 0.9, { g: 0.035, a: 0.35 })); },
    unswell: c => { noise(c, 0, 0.6, { f: 1200, f2: 250, g: 0.04 }); note(c, 554.4, 0, 0.5, { f2: 440, g: 0.04, a: 0.1 }); },
    pluck: c => { note(c, 880, 0, 0.35, { type: "triangle", g: 0.09, a: 0.002 }); note(c, 1318.5, 0.05, 0.4, { type: "triangle", g: 0.06, a: 0.002 }); },
    link: c => { note(c, 659.3, 0, 0.25, { type: "triangle", g: 0.08, a: 0.002 }); note(c, 987.8, 0.09, 0.35, { type: "triangle", g: 0.08, a: 0.002 }); },
    lock: c => { note(c, 180, 0, 0.06, { type: "square", g: 0.05, lp: 1200 }); note(c, 120, 0.05, 0.08, { type: "square", g: 0.05, lp: 900 }); },
    unlock: c => { note(c, 160, 0, 0.05, { type: "square", g: 0.05, lp: 1200 }); bell(c, 1318.5, 0.08, 0.45, 0.07); },
    send: c => noise(c, 0, 0.25, { f: 2400, f2: 400, type: "bandpass", q: 1.5, g: 0.06 }),
    down: c => { note(c, 660, 0, 0.25, { f2: 440, type: "triangle", g: 0.07 }); },

      lib[name](c, opt);
    } catch (e) {}
  }
  // 場面の見分け:アプリごとの [選び方, 音] の並び(上から順に見る)
  let rules = [];
  function soundFor(el){
    for (const [sel, snd] of rules) { const hit = el.closest(sel); if (hit) return typeof snd === "function" ? snd(hit) : snd; }
    const inp = el.closest("input");
    if (inp && (inp.type === "checkbox" || inp.type === "radio")) return inp.checked ? "toggleOn" : "toggleOff";
    if (el.closest("nav button, [role=tab], .tabs button")) return "tab";
    if (el.closest("button, a[href], summary, .chip-b, [data-v]")) return "tap";
    return null;
  }
  function init(appRules){
    rules = appRules || [];
    document.addEventListener("click", e => { const s = e.target && e.target.closest ? soundFor(e.target) : null; if (s) play(s); }, true);
    // エラーの表示(class="err")が出たら、低い音
    try {
      new MutationObserver(ms => { for (const m of ms) { const el = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (!el || !el.closest) continue;

    } catch (e) {}
  }
  // 設定の欄(入/切・音量)。アプリの版の表示のそばに置く
  function mount(anchor){
    if (!anchor || document.getElementById("se-row")) return;
    const row = document.createElement("div"); row.id = "se-row"; row.className = "se-row";
    row.innerHTML = '<span>効果音</span><button type="button" id="se-on" class="se-btn"></button><label class="se-vol">音量 <input id="se-vol" type="range" min="0" max="1" step="0.05"></label>';
    anchor.parentNode.insertBefore(row, anchor.nextSibling);
    const b = row.querySelector("#se-on"), r = row.querySelector("#se-vol");
    const show = () => { b.textContent = on ? "入" : "切"; b.setAttribute("aria-pressed", String(on)); r.value = vol; r.disabled = !on; };
    b.addEventListener("click", () => { on = !on; try { localStorage.setItem("se-on", on ? "1" : "0"); } catch (e) {} show(); if (on) play("toggleOn"); });
    r.addEventListener("input", () => { vol = +r.value; try { localStorage.setItem("se-vol", String(vol)); } catch (e) {} });
    r.addEventListener("change", () => play("done"));
    show();
  }
  return { play, init, mount, soundFor, get on(){ return on; } };
})();

SE.init([
  ["[data-fx-open]", "open"], ["[data-fx-close]", "tab"],
  ["[data-go]", "open"],
  ["#connect, #reload", "open"],
  [".bub, .min[data-min]", el => (SE_SEL_BEFORE === (el.dataset.min || el.getAttribute("data-min"))) ? "toggleOff" : "toggleOn"],
  ["[data-psub], [data-range], [data-cmp]", "tab"],
  ["nav.tabs button", "tab"]
]);

document.addEventListener("pointerdown", () => { SE_SEL_BEFORE = typeof SEL !== "undefined" ? SEL : null; }, true);
(function(){ const go = () => { const a = document.getElementById("conn-msg"); SE.mount(a ? a.closest(".row") : null); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go(); })();
